[package]
name = "proton-security"
version = "0.4.8"
edition = "2024"
rust-version = "1.95"
description = "Windows Security style security center for Proton OS"
license = "GPL-3.0-or-later"
authors = ["Proton OS contributors"]
repository = "https://github.com/ProtonOS-Linux/proton-security-app"
homepage = "https://www.protonos.org"
readme = "README.md"
keywords = ["security", "antivirus", "firewall", "linux", "desktop"]
categories = ["gui", "os::linux-apis"]
publish = false

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37"
egui_extras = { version = "0.37.0", features = ["svg", "image"] }
flate2 = "1.1.10"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
resvg = "0.45.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[package.metadata.deb]
name = "proton-security"
maintainer = "Proton OS <support@protonos.org>"
copyright = "2026, Proton OS contributors"
extended-description = """\
Windows Security style security center for Proton OS: security status at a \
glance (antivirus, security updates, package/Flatpak updates, firewall, \
account protection, device security, performance & health, restore points, \
file backup), ClamAV antivirus with daily and download scanning, firewall \
connections and log, Flatpak app permissions, device manager, USB device \
alerts, a company policy file and an exportable security report."""
section = "admin"
priority = "optional"
depends = "$auto, pkexec | policykit-1, kmod, util-linux, procps, apt, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1 | libwayland-client0"
recommends = "clamav, clamav-freshclam, snapper, unattended-upgrades, ufw, kdialog, libnotify-bin, udisks2, mokutil, kup-backup, xdg-user-dirs, pci.ids, usb.ids, btrfs-assistant, isenkram-cli"
assets = [
    ["target/release/proton-security", "usr/bin/", "755"],
    ["packaging/proton-security-helper", "usr/libexec/proton-security/", "755"],
    # Same script under a second name for protected commands (see docs/SECURITY-MODEL.md).
    ["packaging/proton-security-helper", "usr/libexec/proton-security/proton-security-helper-protected", "755"],
    ["packaging/org.protonos.security.policy", "usr/share/polkit-1/actions/", "644"],
    ["packaging/proton-security.desktop", "usr/share/applications/", "644"],
    ["assets/proton-security.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/proton-security.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/proton-security-tray.desktop", "etc/xdg/autostart/", "644"],
    ["packaging/org.protonos.ProtonSecurity.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/policy.conf.example", "usr/share/doc/proton-security/", "644"],
    ["README.md", "usr/share/doc/proton-security/", "644"],
    ["CHANGELOG.md", "usr/share/doc/proton-security/", "644"],
]
maintainer-scripts = "debian/"
conf-files = ["/etc/xdg/autostart/proton-security-tray.desktop"]

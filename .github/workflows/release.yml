# Builds the Debian package for a version tag (v1.2.3) and publishes it as a
# GitHub release with its SHA-256 checksum. See docs/PACKAGING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Build
        run: |
          cargo test
          cargo install cargo-deb --locked
          cargo deb
          cd target/debian && sha256sum ./*.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            target/debian/*.deb
            target/debian/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                  { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "Proton Security $version" --notes-file notes.md
